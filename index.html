<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARA - POS Mostrador</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        h2 { text-align: center; color: #222; margin: 10px 0; }
        #reader {
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .manual-box {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            gap: 10px;
        }
        .manual-box input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .manual-box button {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #cart-box {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background-color: #f8f9fa; }
        .total-box { font-size: 18px; font-weight: bold; text-align: right; margin-top: 15px; color: #2e7d32; }
        .btn-cobrar {
            background-color: #28a745; color: white; border: none; padding: 15px;
            font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold;
        }
        .btn-limpiar {
            background-color: #dc3545; color: white; border: none; padding: 8px;
            font-size: 14px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px;
        }
        .btn-eliminar {
            background-color: #ff4d4f; color: white; border: none; padding: 5px 8px;
            font-size: 12px; border-radius: 4px; cursor: pointer;
        }
        #estado { text-align: center; font-weight: bold; margin-top: 10px; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h2>POS DARRA</h2>
    
    <!-- Lector de cámara -->
    <div id="reader"></div>
    <div id="estado">Apunta la cámara o ingresa el código...</div>

    <!-- Entrada manual de respaldo -->
    <div class="manual-box">
        <input type="text" id="codigoManual" placeholder="Escribir código de barras...">
        <button onclick="agregarManual()">Agregar</button>
    </div>

    <!-- Carrito de compras -->
    <div id="cart-box">
        <h3>Ítems en el Carrito</h3>
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Cant.</th>
                    <th>Subtotal</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="cart-items">
                <!-- Se listarán los ítems -->
            </tbody>
        </table>
        
        <div class="total-box">
            Total: $<span id="cart-total">0.00</span>
        </div>

        <button class="btn-cobrar" onclick="finalizarVenta()">COBRAR / FINALIZAR</button>
        <button class="btn-limpiar" onclick="vaciarCarrito()">Limpiar Carrito</button>
    </div>
</div>

<script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzX4AyoEyd1FUkibAwu3usYaSHb3Jj0t5t_VawX0lS03olwg1Fzu0ketsD40PtCf6ncVA/exec";
    let carrito = [];

    function agregarAlCarrito(codigo) {
        if (!codigo || codigo.trim() === "") return;
        let itemExistente = carrito.find(item => item.codigo === codigo);
        if (itemExistente) {
            itemExistente.cantidad += 1;
            itemExistente.subtotal = item.cantidad * item.precioUnitario;
        } else {
            carrito.push({ codigo: codigo, cantidad: 1, precioUnitario: 100, subtotal: 100 });
        }
        actualizarVistaCarrito();
    }

    function agregarManual() {
        let input = document.getElementById('codigoManual');
        agregarAlCarrito(input.value.trim());
        input.value = "";
    }

    function eliminarItem(index) {
        carrito.splice(index, 1);
        actualizarVistaCarrito();
    }

    function actualizarVistaCarrito() {
        let tbody = document.getElementById('cart-items');
        tbody.innerHTML = "";
        let total = 0;

        carrito.forEach((item, index) => {
            total += item.subtotal;
            let fila = `<tr>
                <td>${item.codigo}</td>
                <td>${item.cantidad}</td>
                <td>$${item.subtotal.toFixed(2)}</td>
                <td><button class="btn-eliminar" onclick="eliminarItem(${index})">X</button></td>
            </tr>`;
            tbody.innerHTML += fila;
        });

        document.getElementById('cart-total').innerText = total.toFixed(2);
    }

    function vaciarCarrito() {
        carrito = [];
        actualizarVistaCarrito();
        document.getElementById('estado').innerText = "Carrito vaciado.";
    }

    function finalizarVenta() {
        if (carrito.length === 0) {
            alert("El carrito está vacío.");
            return;
        }

        document.getElementById('estado').innerText = "Registrando venta...";

        fetch(URL_APPS_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tipo: "venta_carrito", items: carrito })
        })
        .then(() => {
            document.getElementById('estado').innerText = "¡Venta registrada con éxito!";
            vaciarCarrito();
            setTimeout(() => {
                document.getElementById('estado').innerText = "Apunta la cámara o ingresa el código...";
            }, 2500);
        })
        .catch(error => {
            document.getElementById('estado').innerText = "Error al registrar la venta.";
            console.error(error);
        });
    }

    // Inicialización de la cámara
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 220, height: 120 } },
        (decodedText) => {
            html5QrCode.pause();
            agregarAlCarrito(decodedText);
            document.getElementById('estado').innerText = "¡Escaneado: " + decodedText + "!";
            setTimeout(() => { 
                html5QrCode.resume(); 
                document.getElementById('estado').innerText = "Apunta la cámara o ingresa el código...";
            }, 2500);
        }
    ).catch(err => {
        document.getElementById('estado').innerText = "Cámara no disponible (usar tipeo manual)";
        console.error(err);
    });
</script>
</body>
</html>
