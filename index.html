<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARA - Escáner de Mostrador</title>
    <!-- Librería para lectura de códigos de barras por cámara -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h2 { color: #333; }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
        }
        #resultado {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

    <h2>POS DARA - Escáner</h2>
    <div id="reader"></div>
    <div id="resultado">Apunta la cámara a un código de barras</div>

    <script>
        // Pegá aquí tu URL de la Web App de Apps Script que ya probamos
        const urlWebapp = "https://script.google.com/macros/s/AKfycbzX4AyoEyd1FUkibAwu3usYaSHb3Jj0t5t_VawX0lS03olwg1Fzu0ketsD40PtCf6ncVA/exec";

        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('resultado').innerText = "Enviando código: " + decodedText;

            fetch(urlWebapp, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ codigo: decodedText, cantidad: 1 })
            }).then(() => {
                document.getElementById('resultado').innerText = "¡Registrado con éxito: " + decodedText + "!";
                setTimeout(() => {
                    document.getElementById('resultado').innerText = "Apunta la cámara a un código de barras";
                }, 2000);
            }).catch(err => {
                document.getElementById('resultado').innerText = "Error al enviar el código.";
                console.error(err);
            });
        }

        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 150 } },
            onScanSuccess
        ).catch(err => {
            alert("No se pudo iniciar la cámara. Asegúrate de dar permisos en el navegador.");
            console.error(err);
        });
    </script>
</body>
</html>
