<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARA - Escáner de Mostrador</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h2 { color: #333; }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: auto;
            border-radius: 8px;
            overflow: hidden;
        }
        #resultado {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <h2>POS DARRA</h2>
    <div id="reader"></div>
    <div id="resultado">Apunta la cámara a un código de barras...</div>

    <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzX4AyoEyd1FUkibAwu3usYaSHb3Jj0t5t_VawX0lS03olwg1Fzu0ketsD40PtCf6ncVA/exec";

        function enviarAlSheets(codigo) {
            document.getElementById('resultado').innerText = "Guardando: " + codigo + "...";
            
            fetch(URL_APPS_SCRIPT, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ codigo: codigo, cantidad: 1 })
            })
            .then(() => {
                document.getElementById('resultado').innerText = "¡Guardado con éxito: " + codigo + "!";
                setTimeout(() => {
                    document.getElementById('resultado').innerText = "Apunta la cámara a otro producto...";
                }, 2000);
            })
            .catch(error => {
                document.getElementById('resultado').innerText = "Error al conectar con la planilla";
                console.error(error);
            });
        }

        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 150 } },
            (decodedText, decodedResult) => {
                // Pausa el escáner temporalmente para evitar lecturas repetidas del mismo artículo
                html5QrCode.pause();
                enviarAlSheets(decodedText);
                setTimeout(() => { 
                    html5QrCode.resume(); 
                }, 3500);
            }
        ).catch(err => {
            document.getElementById('resultado').innerText = "Error al iniciar cámara";
            console.error(err);
        });
    </script>
</body>
</html>
